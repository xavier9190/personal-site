name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security-and-tests:
    name: security-and-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run static security checks
        run: npm run security:check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run test suite (PGlite)
        run: npm test

      - name: Build production bundle
        run: npm run build

  migrate-and-deploy:
    name: migrate-and-deploy
    runs-on: ubuntu-latest
    needs: security-and-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Supabase PostgreSQL migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Skipping database migrations: DATABASE_URL secret is not configured."
            exit 0
          fi
          npm run db:migrate

      - name: Deploy production to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Skipping Vercel deploy: VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID secrets must all be configured."
            exit 0
          fi
          npx --yes vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
